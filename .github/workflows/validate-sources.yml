name: Validate source and job descriptions

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax, including every Pages Function
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find assets functions lib worker -type f -name '*.js' -print0 2>/dev/null || true)
      - name: Test description handling
        run: node tests/descriptions.mjs
